name: Sync newest lift log CSV

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-drive
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download newest CSV from Google Drive
        run: python sync_drive.py

      - name: Commit the updated copy
        run: |
          if [ -z "$(git status --porcelain -- data/latest.csv data/meta.json)" ]; then
            echo "data/latest.csv is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.csv data/meta.json
          git commit -m "Sync newest lift log CSV from Google Drive"
          git push